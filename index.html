<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#241528">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bookshelf">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>My Bookshelf</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap">
<style>
:root{--bg:#f3f5f4;--ink:#1d2b2a;--mute:#5d6e6c;--card:#fff;--line:#d3dcda;--accent:#1f6f6b;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#101a19;--ink:#e6efed;--mute:#9bb0ad;--card:#182625;--line:#2b3f3d;--accent:#5fc2bb;--on:#08201e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
h1{font:700 28px/1.1 Fraunces,Georgia,serif;margin:6px 0 4px}
p.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1}
button,select,input[type=text],input[type=month]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
button.pri,.tabs button.on{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.row label{color:var(--mute);font-size:14px}
canvas{width:100%;height:auto;border-radius:10px;display:block;background:#1b3a38}
.note{color:var(--mute);font-size:14px;margin:8px 0 0}
.hide{display:none}
/* cozy theme */
:root{--bg:#241528;--ink:#f1e6d0;--mute:#c9b898;--card:#2c1b38;--line:#8a5a9e;--accent:#e0b96d;--on:#2a1a0e}
body{font-family:Fraunces,Georgia,serif;min-height:100vh;background:
radial-gradient(900px 520px at 12% -5%,rgba(255,190,100,.24),transparent 62%),
repeating-linear-gradient(90deg,#2f1a30 0 38px,#281529 38px 40px)}
h1{color:#f6dfaa;font-size:36px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.card{background:linear-gradient(#3a2347,#2c1b38);border:1px solid #a87a4a;border-radius:6px;margin-bottom:24px;
box-shadow:0 0 0 6px #7a4f2a,0 0 0 7px #b9803f,0 16px 30px rgba(0,0,0,.45)}
button,select,input[type=text],input[type=month]{font-family:inherit;background:#3a2447;color:var(--ink);border-color:#8a5a9e}
button.pri,.tabs button.on{background:linear-gradient(#e8c47a,#c79c4e);color:#2a1a0e;border-color:#e8c47a}
input[type=checkbox]{width:20px;height:20px;accent-color:#e0b96d;vertical-align:middle;margin:0 4px 0 0}
canvas{border-radius:4px;box-shadow:0 0 0 2px #1e1030,0 6px 14px rgba(0,0,0,.4)}
</style>
</head>
<body>
<main>
<h1>My Bookshelf</h1>
<p class="sub">Load your Goodreads export to see what you read each month and to shelve the books you own.</p>

<section class="card">
  <div class="row"><button class="pri" id="pick">Choose Goodreads CSV</button><span class="note" id="status">No file loaded yet.</span></div>
  <input type="file" id="file" accept=".csv,text/csv" class="hide">
  <div class="row"><label for="style">Style</label>
    <select id="style">
      <option value="spines">Spines in cover colors</option>
      <option value="mixed">Some covers facing out</option>
      <option value="all">All covers facing out</option>
    </select></div>
  <p class="note" id="covnote"></p>
</section>

<div class="tabs" id="tabs">
  <button class="on" data-t="month">Monthly shelf</button>
  <button data-t="lib">Library</button>
</div>

<section id="month" class="card">
  <div class="row"><label for="mon">Month</label><input type="month" id="mon"><label><input type="checkbox" id="rate" checked> Show my ratings</label><button id="saveM" class="pri">Save picture</button></div>
  <canvas id="cm" width="1440" height="600"></canvas>
  <p class="note" id="mcount"></p>
</section>

<section id="lib" class="card hide">
  <div class="row">
    <label for="shelf">Shelf name</label><input type="text" id="shelf" value="own" size="12" autocapitalize="none">
    <label for="sort">Sort by</label>
    <select id="sort"><option value="status">Read status</option><option value="author">Author</option><option value="title">Title</option><option value="color">Color</option></select>
    <button id="saveL" class="pri">Save picture</button>
  </div>
  <canvas id="cl" width="1440" height="600"></canvas>
  <p class="note" id="lcount"></p>
</section>
</main>

<script>
var books=[],cache={},timer=null;
var PAL=['#ef6f61','#f4a259','#e9c46a','#2a9d8f','#3a86c8','#7b4fa0','#d6577b','#264a73','#5fb49c','#b0485f','#f08a5d','#8e6bbf'];
function $(i){return document.getElementById(i)}
function hash(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}

function parseCSV(t){
  var rows=[],row=[],f='',q=false;
  for(var i=0;i<t.length;i++){
    var c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){f+='"';i++} else q=false } else f+=c }
    else if(c=='"')q=true;
    else if(c==','){row.push(f);f=''}
    else if(c=='\n'){row.push(f);rows.push(row);row=[];f=''}
    else if(c!='\r')f+=c;
  }
  if(f||row.length){row.push(f);rows.push(row)}
  return rows;
}
function load(text){
  var r=parseCSV(text.replace(/^\uFEFF/,'')),h=r.shift(),ix={};
  h.forEach(function(n,i){ix[n.trim()]=i});
  if(ix['Title']===undefined){$('status').textContent='That does not look like a Goodreads export. Check the file and try again.';return false}
  books=r.filter(function(x){return x.length>1}).map(function(x){
    var g=function(n){return ix[n]===undefined?'':(x[ix[n]]||'').trim()};
    var isbn=g('ISBN13').replace(/[^0-9X]/g,'')||g('ISBN').replace(/[^0-9X]/g,'');
    return {title:g('Title').replace(/\s*\(.*\)$/,''),author:g('Author'),pages:parseInt(g('Number of Pages'))||300,isbn:isbn,
      read:g('Date Read').replace(/\//g,'-').slice(0,7),
      shelves:(g('Bookshelves')+','+g('Exclusive Shelf')).toLowerCase().split(',').map(function(s){return s.trim()}),
      owned:parseInt(g('Owned Copies'))>0,rating:parseInt(g('My Rating'))||0};
  });
  try{localStorage.setItem('gr-csv',text)}catch(e){}
  $('status').textContent=books.length+' books loaded.';
  render();return true;
}

/* covers from Open Library */
function cover(b){
  if(!b.isbn)return null;
  var k=b.isbn,c=cache[k];
  if(c)return c.ok?c:null;
  c=cache[k]={ok:false};
  var img=new Image();img.crossOrigin='anonymous';
  img.onload=function(){
    if(img.naturalWidth<30){return}
    c.img=img;c.ok=true;c.color=avg(img);schedule();
  };
  img.onerror=function(){};
  img.src='https://covers.openlibrary.org/b/isbn/'+k+'-M.jpg?default=false';
  return null;
}
function avg(img){
  try{
    var t=document.createElement('canvas');t.width=t.height=8;
    var x=t.getContext('2d');x.drawImage(img,0,0,8,8);
    var d=x.getImageData(0,0,8,8).data,r=0,g=0,b=0,n=64;
    for(var i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2]}
    return '#'+[r,g,b].map(function(v){return ('0'+Math.round(v/n).toString(16)).slice(-2)}).join('');
  }catch(e){return null}
}
function schedule(){clearTimeout(timer);timer=setTimeout(render,400)}

function spine(b,i,mode,stars){
  var hv=hash(b.title+b.author),p=Math.min(b.pages,900),cv=cover(b);
  var face=cv&&(mode=='all'||(mode=='mixed'&&i%5==0));
  if(face)return {w:74,h:111,face:cv.img,c:cv.color||'#444',b:b};
  return {w:Math.round(26+p/900*20),h:Math.round((stars?150:120)+p/900*(stars?45:50)+(hv%14)),c:(cv&&cv.color)||PAL[hv%PAL.length],b:b};
}
function hue(c){
  var r=parseInt(c.substr(1,2),16)/255,g=parseInt(c.substr(3,2),16)/255,bl=parseInt(c.substr(5,2),16)/255;
  var mx=Math.max(r,g,bl),mn=Math.min(r,g,bl),d=mx-mn;if(!d)return -1;
  var h=mx==r?((g-bl)/d)%6:mx==g?(bl-r)/d+2:(r-g)/d+4;return (h*60+360)%360;
}
function shade(c,a){
  var n=parseInt(c.slice(1),16),k=function(v){return Math.max(0,Math.min(255,v))};
  return 'rgb('+k((n>>16)+a)+','+k(((n>>8)&255)+a)+','+k((n&255)+a)+')';
}
function fit(ctx,s,max){
  if(ctx.measureText(s).width<=max)return s;
  while(s.length>2&&ctx.measureText(s+'…').width>max)s=s.slice(0,-1);return s+'…';
}
function spineText(ctx,title,len,wid){
  var t=title.split(':')[0].trim()||title,sz,i;
  for(sz=11;sz>=8;sz--){
    ctx.font='600 '+sz+'px system-ui,sans-serif';
    if(ctx.measureText(t).width<=len){ctx.fillText(t,0,0);return}
  }
  var w=t.split(' ');
  for(sz=10;sz>=8&&wid>=2*sz+2;sz--){
    ctx.font='600 '+sz+'px system-ui,sans-serif';
    var best=null;
    for(i=1;i<w.length;i++){
      var a=w.slice(0,i).join(' '),b=w.slice(i).join(' ');
      var m=Math.max(ctx.measureText(a).width,ctx.measureText(b).width);
      if(m<=len&&(!best||m<best.m))best={a:a,b:b,m:m};
    }
    if(best){ctx.fillText(best.a,0,-sz*.65);ctx.fillText(best.b,0,sz*.65);return}
  }
  ctx.font='600 8px system-ui,sans-serif';
  ctx.fillText(fit(ctx,t,len),0,0);
}
function star(ctx,cx,cy,r){
  ctx.beginPath();
  for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;ctx.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}
  ctx.closePath();ctx.fillStyle='#f7c948';ctx.fill();ctx.lineWidth=.8;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.stroke();
}
function rr(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function blade(ctx,x,y,len,wid,ang,col){
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.fillStyle=col;ctx.beginPath();
  ctx.moveTo(-wid/2,0);ctx.quadraticCurveTo(-wid*.7,-len*.55,0,-len);ctx.quadraticCurveTo(wid*.7,-len*.55,wid/2,0);
  ctx.closePath();ctx.fill();ctx.restore();
}
function broad(ctx,x,y,len,wid,ang,col,rib){
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-len/2,wid/2,len/2,0,0,6.3);ctx.fill();
  ctx.strokeStyle=rib;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-len);ctx.stroke();
  ctx.restore();
}
function fan(ctx,cx,by,n,len,wid,spread,c1,c2){
  for(var i=0;i<n;i++){
    var t=n==1?0:(i/(n-1)*2-1);
    blade(ctx,cx+t*4,by,len*(1-Math.abs(t)*.25),wid,t*spread,i%2?c2:c1);
  }
}
function pot(ctx,cx,by,w,h,col,rim,band){
  ctx.fillStyle=col;ctx.beginPath();
  ctx.moveTo(cx-w/2+3,by-h);ctx.lineTo(cx+w/2-3,by-h);ctx.lineTo(cx+w/2-7,by);ctx.lineTo(cx-w/2+7,by);
  ctx.closePath();ctx.fill();
  if(band){ctx.fillStyle=band;ctx.fillRect(cx-w/2+5,by-h*.55,w-10,h*.16)}
  ctx.fillStyle=rim;rr(ctx,cx-w/2,by-h-4,w,h*.28+4,2);ctx.fill();
}
function sceneWall(ctx,W,H){
  var g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#46a6a6');g.addColorStop(1,'#2c6590');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function sceneFloor(ctx,W,yf,H){
  ctx.fillStyle='#4f86c6';ctx.fillRect(0,yf-8,W,8);
  ctx.save();ctx.beginPath();ctx.rect(0,yf,W,H-yf);ctx.clip();
  ctx.fillStyle='#7d4aa3';ctx.fillRect(0,yf,W,H-yf);
  var k=0;
  for(var x=-120;x<W+40;x+=70,k++){
    ctx.fillStyle=k%2?'#9660ba':'#8452aa';
    ctx.beginPath();ctx.moveTo(x,yf);ctx.lineTo(x+70,yf);ctx.lineTo(x+24,H);ctx.lineTo(x-46,H);ctx.closePath();ctx.fill();
  }
  ctx.restore();
  var yr=yf+74;
  ctx.fillStyle='#e8903f';ctx.beginPath();ctx.ellipse(140,yr,82,17,0,0,6.3);ctx.fill();
  ctx.fillStyle='#f0a64b';ctx.beginPath();ctx.ellipse(140,yr,70,13,0,0,6.3);ctx.fill();
  ctx.fillStyle='#f7c46f';ctx.beginPath();ctx.ellipse(140,yr,52,9,0,0,6.3);ctx.fill();
  openBook(ctx,300,yr+2);
}
function openBook(ctx,cx,cy){
  function poly(p,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(var i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath();ctx.fill()}
  poly([[cx-72,cy-1],[cx,cy-9],[cx+72,cy-1],[cx+78,cy+19],[cx,cy+15],[cx-78,cy+19]],'#d8564a');
  poly([[cx-66,cy-5],[cx,cy-13],[cx,cy+10],[cx-72,cy+14]],'#f6ecd2');
  poly([[cx,cy-13],[cx+66,cy-5],[cx+72,cy+14],[cx,cy+10]],'#ecdfbb');
  ctx.strokeStyle='#c9b88f';ctx.lineWidth=1;
  for(var i=0;i<4;i++){
    var o=i*4.5;
    ctx.beginPath();ctx.moveTo(cx-58,cy-1+o);ctx.lineTo(cx-8,cy-6+o);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+8,cy-6+o);ctx.lineTo(cx+58,cy-1+o);ctx.stroke();
  }
}
function sceneWindow(ctx){
  var x0=412,x1=520,yb=132,cx=466,r=54,yc=72;
  function arch(i){ctx.beginPath();ctx.moveTo(x0+i,yb-i);ctx.lineTo(x0+i,yc);ctx.arc(cx,yc,r-i,Math.PI,0);ctx.lineTo(x1-i,yb-i);ctx.closePath()}
  arch(0);ctx.fillStyle='#d99a52';ctx.fill();
  arch(6);ctx.save();ctx.clip();
  var g=ctx.createLinearGradient(0,18,0,yb);g.addColorStop(0,'#ee5f93');g.addColorStop(.6,'#f58a7a');g.addColorStop(1,'#f9b56e');
  ctx.fillStyle=g;ctx.fillRect(x0,18,x1-x0,yb-18);
  ctx.fillStyle='#ffe0a8';ctx.beginPath();ctx.arc(446,64,11,0,6.3);ctx.fill();
  ctx.fillStyle='#f3b97a';ctx.beginPath();ctx.moveTo(x0,120);ctx.quadraticCurveTo(450,94,x1,114);ctx.lineTo(x1,yb);ctx.lineTo(x0,yb);ctx.closePath();ctx.fill();
  ctx.fillStyle='#e79a62';ctx.beginPath();ctx.moveTo(x0,128);ctx.quadraticCurveTo(480,108,x1,126);ctx.lineTo(x1,yb);ctx.lineTo(x0,yb);ctx.closePath();ctx.fill();
  blade(ctx,438,118,26,6,-.4,'#3f8f55');blade(ctx,438,118,31,6,0,'#4fa064');blade(ctx,438,118,24,6,.45,'#3f8f55');
  blade(ctx,497,122,30,7,-.2,'#3f8f55');blade(ctx,497,122,24,7,.4,'#4fa064');
  ctx.restore();
  ctx.fillStyle='#d99a52';ctx.fillRect(cx-2.5,18,5,yb-18);ctx.fillRect(x0,86,x1-x0,5);
  ctx.fillStyle='#b87a3c';rr(ctx,x0-6,yb-2,x1-x0+12,8,2);ctx.fill();
}
function sceneLamp(ctx){
  ctx.strokeStyle='#22303f';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(352,0);ctx.lineTo(352,58);ctx.stroke();
  ctx.fillStyle='#22303f';rr(ctx,346,56,12,9,2);ctx.fill();
  var g=ctx.createRadialGradient(352,76,2,352,76,46);g.addColorStop(0,'rgba(255,236,150,.75)');g.addColorStop(1,'rgba(255,236,150,0)');
  ctx.fillStyle=g;ctx.fillRect(300,30,104,104);
  ctx.fillStyle='#ffe98a';ctx.beginPath();ctx.arc(352,76,9,0,6.3);ctx.fill();
}
function floorPlants(ctx,H){
  var by=H-14,i;
  // big broad-leaf plant
  pot(ctx,438,by,46,40,'#c85a3c','#dd6e4d','#4fb3b8');
  [-.95,-.5,0,.5,.95].forEach(function(a,k){broad(ctx,438,by-40,64-Math.abs(a)*14,26,a,k%2?'#247a4a':'#2e8b57','#6bc58d')});
  // spiky plant
  pot(ctx,492,by,36,30,'#e8903f','#f2a85c');
  fan(ctx,492,by-30,7,52,10,.95,'#3aa05a','#2a8a4a');
  // small bushy plant
  pot(ctx,531,by,28,24,'#a8403a','#c05048');
  fan(ctx,531,by-24,9,34,9,1.3,'#4fa85a','#8fd16a');
}
function decor(ctx,ri,x,base){
  if(516-x<64)return;
  var cx=488,k=ri%3,i;
  if(k==0){
    pot(ctx,cx,base,28,22,'#b58ad6','#c9a3e6');
    fan(ctx,cx,base-22,7,24,7,1.1,'#3a9a6a','#2d8a5a');
  }else if(k==1){
    var cols=['#e9c46a','#d6577b','#3a86c8'],w=[44,38,42],yy=base;
    for(i=0;i<3;i++){
      yy-=11;var ox=cx-w[i]/2+(i-1)*3;
      ctx.fillStyle=cols[i];rr(ctx,ox,yy,w[i],11,2);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(ox+4,yy+4,w[i]-8,2);
    }
  }else{
    pot(ctx,cx,base,26,20,'#e57f9a','#f29ab2');
    ctx.fillStyle='#4fb3a6';
    [[-7,-28,10],[7,-29,10],[0,-37,10],[0,-27,11]].forEach(function(c){ctx.beginPath();ctx.arc(cx+c[0],base+c[1],c[2],0,6.3);ctx.fill()});
  }
}
function draw(cv,list,title,mode,brk,stars){
  var W=560,bx=44,bxMax=516,rowH=stars?226:200,tbrH=40,tbr=-1,
      sp=list.map(function(b,i){return spine(b,i,mode,stars)}),rows=[[]],x=bx;
  sp.forEach(function(s,i){
    if((i===brk||x+s.w>bxMax)&&rows[rows.length-1].length){rows.push([]);x=bx}
    if(i===brk)tbr=rows.length-1;
    rows[rows.length-1].push(s);x+=s.w+3;
  });
  var railY=170,rowsTop=railY+14,
      rowTopOf=function(ri){return rowsTop+ri*rowH+(tbr>-1&&ri>tbr?tbrH:0)},
      baseOf=function(ri){return rowTopOf(ri)+rowH-22+(tbr>-1&&ri===tbr?tbrH:0)},
      lastBase=baseOf(rows.length-1),caseBottom=lastBase+28,yf=caseBottom-12,H=yf+120;
  cv.width=W*2;cv.height=H*2;
  var ctx=cv.getContext('2d');ctx.scale(2,2);
  sceneWall(ctx,W,H);sceneWindow(ctx);sceneLamp(ctx);sceneFloor(ctx,W,yf,H);
  // bookcase: back panel, posts, kickboard, top rail
  var bg=ctx.createLinearGradient(34,0,526,0);bg.addColorStop(0,'#2f7694');bg.addColorStop(1,'#25607f');
  ctx.fillStyle=bg;ctx.fillRect(34,rowsTop,492,lastBase+14-rowsTop);
  ctx.fillStyle='#a56a30';ctx.fillRect(34,lastBase+12,492,16);
  [22,526].forEach(function(px){
    ctx.fillStyle='#d99a52';ctx.fillRect(px,railY,12,caseBottom-railY);
    ctx.fillStyle='#eab870';ctx.fillRect(px,railY,2,caseBottom-railY);
    ctx.fillStyle='#b87a3c';ctx.fillRect(px+9,railY,3,caseBottom-railY);
  });
  ctx.fillStyle='#e3a85e';rr(ctx,18,railY,524,14,2);ctx.fill();
  ctx.fillStyle='#f0c07e';ctx.fillRect(18,railY,524,3);
  ctx.fillStyle='#b87a3c';ctx.fillRect(18,railY+11,524,3);
  // plants on top of the bookcase
  pot(ctx,84,railY,34,26,'#b58ad6','#c9a3e6');fan(ctx,84,railY-26,7,56,11,.9,'#3aa05a','#2a8a4a');
  pot(ctx,140,railY,34,24,'#d9694a','#ea7c5c');fan(ctx,140,railY-24,9,34,8,1.2,'#4fa85a','#8fd16a');
  pot(ctx,196,railY,32,26,'#e57f9a','#f29ab2');fan(ctx,196,railY-26,6,62,11,.8,'#2e8b57','#3aa05a');
  // shelves and books
  rows.forEach(function(row,ri){
    var rowTop=rowTopOf(ri),base=baseOf(ri),x=bx;
    ctx.fillStyle='rgba(8,24,56,.25)';ctx.fillRect(34,base+12,492,8);
    ctx.fillStyle='#d99a52';ctx.fillRect(34,base,492,12);
    ctx.fillStyle='#eab870';ctx.fillRect(34,base,492,3);
    ctx.fillStyle='#b87a3c';ctx.fillRect(34,base+9,492,3);
    if(ri===tbr){
      ctx.font='700 15px Fraunces,Georgia,serif';ctx.textAlign='left';ctx.textBaseline='middle';
      var tw=ctx.measureText('To be read').width+22;
      ctx.fillStyle='rgba(8,24,56,.3)';rr(ctx,bx+2,rowTop+9,tw,24,4);ctx.fill();
      ctx.fillStyle='#fff1cf';rr(ctx,bx,rowTop+7,tw,24,4);ctx.fill();
      ctx.fillStyle='#4a2a5e';ctx.fillText('To be read',bx+11,rowTop+19.5);
      ctx.textBaseline='alphabetic';
    }
    row.forEach(function(s){
      var y=base-s.h;
      if(s.face){
        ctx.fillStyle='rgba(20,0,40,.35)';ctx.fillRect(x+3,y+3,s.w,s.h);
        ctx.drawImage(s.face,x,y,s.w,s.h);
        if(stars&&s.b.rating){
          ctx.fillStyle='rgba(20,10,40,.72)';ctx.fillRect(x,y+s.h-18,s.w,18);
          var rc=s.b.rating,sx=x+s.w/2-(rc-1)*7;
          for(var q=0;q<rc;q++)star(ctx,sx+q*14,y+s.h-9,5);
        }
      }else{
        ctx.fillStyle=s.c;rr(ctx,x,y,s.w,s.h,2);ctx.fill();
        ctx.fillStyle=shade(s.c,-38);ctx.fillRect(x+s.w-3,y+1,3,s.h-2);
        ctx.fillStyle=shade(s.c,50);ctx.fillRect(x,y+9,s.w,3);ctx.fillRect(x,y+s.h-13,s.w,3);
        var rt=stars?(s.b.rating||0):0,t0=rt?26+rt*10:0,len=rt?s.h-t0-26:s.h-30;
        for(var k=0;k<rt;k++)star(ctx,x+s.w/2,y+22+k*10,4.4);
        ctx.save();ctx.translate(x+s.w/2,y+(t0+s.h)/2);ctx.rotate(Math.PI/2);
        ctx.font='600 11px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
        var lum=parseInt(s.c.substr(1,2),16)*.3+parseInt(s.c.substr(3,2),16)*.6+parseInt(s.c.substr(5,2),16)*.1;
        ctx.fillStyle=lum>150?'#1d1d1d':'#fff';
        spineText(ctx,s.b.title,len,s.w-8);ctx.restore();
      }
      x+=s.w+3;
    });
    decor(ctx,ri,x,base);
  });
  floorPlants(ctx,H);
  if(title){
    var fs=24;ctx.textAlign='left';ctx.textBaseline='alphabetic';
    do{ctx.font='700 '+fs+'px Fraunces,Georgia,serif';fs--}while(ctx.measureText(title).width>290&&fs>14);
    ctx.fillStyle='rgba(10,20,60,.35)';ctx.fillText(title,41.5,53.5);
    ctx.fillStyle='#fff1cf';ctx.fillText(title,40,52);
  }
  // soft beam of lamplight
  var lg=ctx.createLinearGradient(352,84,150,H);lg.addColorStop(0,'rgba(255,240,170,.22)');lg.addColorStop(1,'rgba(255,240,170,0)');
  ctx.fillStyle=lg;ctx.beginPath();ctx.moveTo(346,84);ctx.lineTo(358,84);ctx.lineTo(250,H);ctx.lineTo(40,H);ctx.closePath();ctx.fill();
}
function lastName(a){var p=a.split(' ');return (p[p.length-1]||'').toLowerCase()}
function render(){
  var mode=$('style').value,m=$('mon').value;
  var mb=books.filter(function(b){return b.read===m});
  draw($('cm'),mb,mb.length?new Date(m+'-15').toLocaleDateString(undefined,{month:'long',year:'numeric'})+': '+mb.length+(mb.length==1?' book':' books'):'',mode,-1,$('rate').checked);
  var rated=mb.filter(function(b){return b.rating>0}),avg=rated.length?(rated.reduce(function(a,b){return a+b.rating},0)/rated.length).toFixed(1):'';
  $('mcount').textContent=books.length?(mb.length?mb.length+' finished this month.'+(avg?' Average rating '+avg+'.':''):'No books with a Date Read in this month.'):'Load your CSV to see your shelf.';
  var sh=$('shelf').value.trim().toLowerCase(),sort=$('sort').value;
  var lb=books.filter(function(b){return b.shelves.indexOf(sh)>-1});
  var rd=function(x){return (x.shelves.indexOf('read')>-1||x.read)?1:0};
  lb.sort(function(a,b){
    if(sort=='status'){var d=rd(b)-rd(a);if(d)return d}
    if(sort=='title')return a.title.localeCompare(b.title);
    if(sort=='color'){var ca=cover(a),cb=cover(b);return hue((ca&&ca.color)||PAL[hash(a.title+a.author)%PAL.length])-hue((cb&&cb.color)||PAL[hash(b.title+b.author)%PAL.length])}
    return lastName(a.author).localeCompare(lastName(b.author))||a.title.localeCompare(b.title);
  });
  var brk=sort=='status'?lb.filter(rd).length:-1;
  draw($('cl'),lb,'My library: '+lb.length+(lb.length==1?' book':' books'),mode,brk);
  $('lcount').textContent=books.length?lb.length+' books on the "'+sh+'" shelf.'+(lb.length?'':' Check the shelf name matches your Goodreads shelf.'):'Load your CSV to see your library.';
  var shown=mb.concat(lb),found=shown.filter(function(b){return cover(b)}).length;
  $('covnote').textContent=shown.length?'Covers found for '+found+' of '+shown.length+' books shown. Books without a cover keep a plain spine.':'';
}
function save(cv,name){
  try{
    cv.toBlob(function(bl){
      if(!bl)return;
      var f=new File([bl],name,{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){})}
      else{var a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=name;a.click()}
    });
  }catch(e){alert('Saving was blocked because the cover images do not allow it. Switch Style to "Spines in cover colors", or take a screenshot instead.')}
}
$('pick').onclick=function(){$('file').click()};
$('file').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){load(r.result)};r.readAsText(f)};
$('tabs').onclick=function(e){
  var t=e.target.dataset.t;if(!t)return;
  [].forEach.call($('tabs').children,function(b){b.classList.toggle('on',b.dataset.t==t)});
  $('month').classList.toggle('hide',t!='month');$('lib').classList.toggle('hide',t!='lib');
};
['mon','shelf','sort','style','rate'].forEach(function(i){$(i).oninput=render});
$('saveM').onclick=function(){save($('cm'),'books-'+$('mon').value+'.png')};
$('saveL').onclick=function(){save($('cl'),'my-library.png')};
(function(){
  var d=new Date();$('mon').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  fetch('goodreads_library_export.csv?v='+Date.now())
    .then(function(r){if(!r.ok)throw 0;return r.text()})
    .then(function(t){if(!load(t))throw 0})
    .catch(function(){try{var s=localStorage.getItem('gr-csv');if(s)load(s)}catch(e){}render()});
  render();
})();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
